server:
  port: 8080

spring:
  application:
    name: medical-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medical_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: medical
    password: Medical@2026
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.hospital.medical: debug
